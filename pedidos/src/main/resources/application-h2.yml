# Perfil h2: base de ARCHIVO en ./data (persiste al reiniciar). MODE=MySQL acerca el SQL al de producción.
spring:
  datasource:
    url: jdbc:h2:file:./data/pedidos;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
