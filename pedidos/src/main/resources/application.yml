# ---------------------------------------------------------------
# Microservicio pedidos - configuración común a todos los perfiles.
# Perfil por defecto: h2 (desarrollo sin instalar nada). En Docker/AWS se usa "mysql".
# Todo lo sensible se lee de variables de entorno; los valores después de ":" son SOLO
# para desarrollo local (el perfil mysql exige los reales, sin valor por defecto).
# ---------------------------------------------------------------
server:
  port: ${PORT:8083}

spring:
  application:
    name: pedidos
  profiles:
    default: h2
  jpa:
    # update crea/ajusta las tablas en el primer arranque; con datos reales usar validate (DDL_AUTO=validate)
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

app:
  # JWT: secreto Base64 COMPARTIDO con usuarios y catalogo (mínimo 32 bytes). Valor de desarrollo:
  jwt:
    secreto: ${JWT_SECRET:c29uaWRvLXZpdm8tY2xhdmUtZGUtZGVzYXJyb2xsby1jYW1iaWFyLWVuLXByb2R1Y2Npb24tMjAyNg==}
    expiracion-minutos: ${JWT_EXPIRACION_MINUTOS:120}
  # Clave de servicio que pedidos ENVÍA a catalogo (X-Internal-Api-Key). Debe ser la misma de catalogo:
  internal:
    api-key: ${INTERNAL_API_KEY:clave-interna-solo-desarrollo}
  # Dirección interna de catalogo (en Docker: http://catalogo:8082). No pasa por el Gateway.
  catalogo:
    url: ${CATALOGO_URL:http://localhost:8082}
    timeout-ms: ${CATALOGO_TIMEOUT_MS:5000}
  openapi:
    titulo: Sonido Vivo - Pedidos
    descripcion: "Checkout (boletas), historial de compras y reportes de ventas. Comprar es público; el resto requiere el token de POST /api/v1/auth/login (servicio Usuarios)."

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
