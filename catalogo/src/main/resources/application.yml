# ---------------------------------------------------------------
# Microservicio catalogo - configuración común a todos los perfiles.
# Perfil por defecto: h2 (desarrollo sin instalar nada). En Docker/AWS se usa "mysql".
# Todo lo sensible se lee de variables de entorno; los valores después de ":" son SOLO
# para desarrollo local (el perfil mysql exige los reales, sin valor por defecto).
# ---------------------------------------------------------------
server:
  port: ${PORT:8082}

spring:
  application:
    name: catalogo
  profiles:
    default: h2
  jpa:
    # update crea/ajusta las tablas en el primer arranque; con datos reales usar validate (DDL_AUTO=validate)
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

app:
  # JWT: secreto Base64 COMPARTIDO con usuarios y pedidos (mínimo 32 bytes). Valor de desarrollo:
  jwt:
    secreto: ${JWT_SECRET:c29uaWRvLXZpdm8tY2xhdmUtZGUtZGVzYXJyb2xsby1jYW1iaWFyLWVuLXByb2R1Y2Npb24tMjAyNg==}
    expiracion-minutos: ${JWT_EXPIRACION_MINUTOS:120}
  # Clave de servicio para /internal/** (la envía pedidos en X-Internal-Api-Key). Valor de desarrollo:
  internal:
    api-key: ${INTERNAL_API_KEY:clave-interna-solo-desarrollo}
  # Carga de las 10 categorías y 51 productos si las tablas están vacías
  semilla:
    habilitada: ${SEMILLA:true}
  openapi:
    titulo: Sonido Vivo - Catálogo
    descripcion: "Categorías, productos, ofertas y stock. Lectura pública; escritura solo Administrador (token de POST /api/v1/auth/login en el servicio Usuarios)."

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
